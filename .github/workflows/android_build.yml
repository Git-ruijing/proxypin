name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      - name: Get dependencies
        run: flutter pub get

      # - name: Analyze project source
      #   run: flutter analyze --no-pub || true

      # 测试在CI环境中运行受限（缺少本地文件、网络连接等），跳过
      # - name: Run tests
      #   run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --target-platform=android-arm64 --no-tree-shake-icons

      - name: Extract version for artifact name
        id: version
        run: echo "app_version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | awk -F+ '{print $1}')" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxypin-android-v${{ steps.version.outputs.app_version }}
          path: build/app/outputs/flutter-apk/proxypin-*.apk
