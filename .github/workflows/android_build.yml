name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

        # 2. 缓存 NDK/CMake（NDK 工具链）
      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/*
            /usr/local/lib/android/sdk/cmake/*
          key: ndk-cmake-${{ runner.os }}-${{ hashFiles('android/gradle.properties') }}
          restore-keys: |
            ndk-cmake-${{ runner.os }}-


      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format .

      # - name: Analyze project source
      #   run: flutter analyze --no-pub || true

      # 测试在CI环境中运行受限（缺少本地文件、网络连接等），跳过
      # - name: Run tests
      #   run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --target-platform=android-arm64 --no-tree-shake-icons

      - name: Extract version for artifact name
        run: echo "APP_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxypin-android-v${{ env.APP_VERSION }}
          path: build/app/outputs/flutter-apk/proxypin-*.apk
